server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /mcp {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mcp_upstream api:8000;
        proxy_pass http://$mcp_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires off;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, must-revalidate";
        expires off;
    }

    location ~* \.(js|css|wasm|json|png|jpe?g|gif|svg|ico|txt|xml|map|woff2?|ttf|otf|mjs)$ {
        add_header Cache-Control "no-cache";
        expires off;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        expires off;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml;
    gzip_min_length 1024;
}
