<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Not found — Mountjoy Software Solutions</title>
  <link rel="icon" type="image/png" href="/favicon.png"/>
  <style>
    :root {
      --bg: #F7EBEA;
      --fg: #1C1917;
      --muted: #6b625f;
      --accent: #E65C20;
      --error: #DC2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --fg: #F6E2DF;
        --muted: #a89a96;
        --error: #F87171;
      }
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo,
        Consolas, monospace;
      font-size: 15px;
      line-height: 1.65;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 22vh 24px 40px;
    }
    img.mark { height: 44px; margin-bottom: 26px; }
    .prompt { color: var(--accent); font-weight: 700; }
    .headline { color: var(--error); margin: 12px 0; }
    p { color: var(--muted); margin: 12px 0 26px; font-size: 14px; }
    a {
      color: var(--accent);
      text-decoration: underline;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="/media/logo.png" alt="" onerror="this.style.display='none'">
    <div><span class="prompt">&gt; </span><span id="path"></span></div>
    <div class="headline">file not found</div>
    <p>That file is not on the server. If you followed a link from somewhere
       on this site, it is a broken link and worth telling me about.</p>
    <a href="/"><span class="prompt">&lt; </span>back to the terminal</a>
  </main>
  <script>
    document.getElementById('path').textContent = location.pathname;
  </script>
</body>
</html>
