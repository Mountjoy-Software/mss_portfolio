name: mss-portfolio

services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: -jar DynamoDBLocal.jar -sharedDb -inMemory
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8000"]
      interval: 5s
      timeout: 3s
      retries: 10

  dynamodb-init:
    image: amazon/aws-cli:latest
    depends_on:
      dynamodb:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
    entrypoint:
      - sh
      - -c
      - |
        aws dynamodb create-table \
          --endpoint-url http://dynamodb:8000 \
          --table-name mss-portfolio \
          --attribute-definitions AttributeName=pk,AttributeType=S AttributeName=sk,AttributeType=S \
          --key-schema AttributeName=pk,KeyType=HASH AttributeName=sk,KeyType=RANGE \
          --billing-mode PAY_PER_REQUEST 2>/dev/null \
          && echo "table created" || echo "table already exists"

  api:
    build:
      context: ./backend
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      ENV: local
      APP_VERSION: compose
      DDB_TABLE: mss-portfolio
      DDB_ENDPOINT: http://dynamodb:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      IP_HASH_SALT: local-dev-salt
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set it in .env, see scripts/dev.sh}
      CORS_ORIGINS: '["http://localhost:8080","http://localhost:3000"]'
    volumes:
      - ./backend/src:/app/src:ro
    command:
      - python
      - -m
      - uvicorn
      - src.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - ./frontend/build/web:/usr/share/nginx/html:ro
      - ./deploy/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
